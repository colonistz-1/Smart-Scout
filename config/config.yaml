# Central place for all experiment settings.
# Change hyperparameters here — never hard-code them in your scripts.
# For a new experiment, copy this file (e.g. config_exp02.yaml) and pass it
# to the training script:  python scripts/train.py --config config/config_exp02.yaml

data:
  # Path to your dataset. The example falls back to the built-in Iris dataset
  # when this file does not exist, so the template runs out of the box.
  path: data/iris.csv
  target_column: species
  test_size: 0.2

model:
  type: random_forest        # see src/model.py for supported types
  params:
    n_estimators: 200
    max_depth: 5
    random_state: 42

training:
  random_state: 42

output:
  model_path: models/model.joblib
  metrics_path: outputs/metrics.json
  figures_dir: outputs/figures
